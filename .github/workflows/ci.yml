name: Check source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python tests/rust-license-materials.py
      - run: python tests/compiler-build-evidence.py
      - run: python tests/native-license-materials.py
      - run: python tests/compiler-rust-graph.py
      - run: python tests/rust-standard-library.py
      - run: python tests/biber-build-evidence.py
      - run: python tests/biber-cpan-materials.py
      - run: python tests/biber-unicode-evidence.py
      - run: python tests/biber-autosplit-evidence.py
      - run: python tests/biber-generated-evidence.py
      - run: python tests/tex-font-materials.py
      - run: python tests/tex-resource-materials.py
      - run: python tests/tex-generated-materials.py
      - run: python tests/biber-native-materials.py
      - run: python tests/biber-module-materials.py
      - run: python tests/npm-license-materials.py
      - run: python tests/javascript-publisher-sources.py
      - run: python tests/pdfjs-license-materials.py
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run website:build
      - run: npm run skill:build && git diff --exit-code -- skills/
