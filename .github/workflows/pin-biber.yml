name: Pin Biber archives
# Sourceforge is the only official Biber 2.17 binary source. Run this once on a
# branch: it records the SHA-256 of each unpinned Windows/Linux archive in
# scripts/runtime-config.mjs and commits it, so later builds verify those bytes.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/pin-biber.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit pinned digests
        run: |
          if git diff --quiet -- scripts/runtime-config.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(runtime): pin Biber 2.17 Windows and Linux archives' -- scripts/runtime-config.mjs
          git push
