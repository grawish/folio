name: Qualify Apple silicon candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Confirm native Apple silicon
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run setup
      - name: Prepare PDF comparison tools
        run: |
          brew install poppler
          python3 -m venv "$RUNNER_TEMP/folio-pdf-tests"
          "$RUNNER_TEMP/folio-pdf-tests/bin/python" -m pip install --disable-pip-version-check -r scripts/template-test-requirements.txt
          echo "FOLIO_PYTHON=$RUNNER_TEMP/folio-pdf-tests/bin/python" >> "$GITHUB_ENV"
      - run: npm run format:check && npm test && npm run test:integration
      - name: Compare all twelve template PDFs with reviewed images
        run: npm run test:template-images
      - run: npm run dist -- --publish never
      - run: node scripts/test-mac-release.mjs release
      - run: node scripts/verify-mac-package.mjs release
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-silicon-qualification-${{ github.sha }}
          path: |
            release/native-tests.json
            release/verification.json
            release/SHA256SUMS
            release/disk-image-verification.log
            test-results/*-final.log
            test-results/chat-*/failure.png
            test-results/chat-*/lifecycle.json
            test-results/chat-*/native-output.log
            test-results/workspace-*/layout-measurements.json
            test-results/workspace-*/failure.png
            test-results/workspace-*/result.json
            test-results/diagnostics-*/result.json
            test-results/diagnostics-*/failure.png
            test-results/fonts-*/result.json
            test-results/fonts-*/failure.png
            test-results/support-*/result.json
            test-results/support-*/failure.png
            test-results/save-recovery-*/result.json
            test-results/save-recovery-*/failure.png
            test-results/pack-catalog-*/result.json
            test-results/pack-catalog-*/failure.png
            test-results/template-regression-*/
          if-no-files-found: warn
          retention-days: 14
      # Do not upload the runtime/DMG yet: redistribution materials, signing,
      # notarization and signing-aware manifests remain release requirements.
