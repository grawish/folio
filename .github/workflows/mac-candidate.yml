name: Qualify Apple silicon candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Confirm native Apple silicon
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run setup
      - name: Verify the prepared compiler matches the public pack
        run: node --import tsx scripts/verify-pack-base.ts
      - name: Prepare PDF comparison tools
        run: |
          brew install poppler
          python3 -m venv "$RUNNER_TEMP/folio-pdf-tests"
          "$RUNNER_TEMP/folio-pdf-tests/bin/python" -m pip install --disable-pip-version-check -r scripts/template-test-requirements.txt
          echo "FOLIO_PYTHON=$RUNNER_TEMP/folio-pdf-tests/bin/python" >> "$GITHUB_ENV"
      - run: npm run format:check && npm test && npm run test:integration
      - name: Check the actual Electron app-update transfer and cache
        run: npm run test:update-download
      - name: Compare all twelve template PDFs with reviewed images
        run: npm run test:template-images
      - run: npm run dist -- --publish never
      - run: node scripts/test-mac-release.mjs release
      - run: node scripts/verify-mac-package.mjs release
      - name: Inventory the exact qualified app
        run: node --import tsx scripts/inventory-mac-app.ts release/mac-arm64/Folio.app
      - name: Reproduce packaged JavaScript and verify publisher sources
        run: |
          node scripts/inventory-javascript.mjs release/mac-arm64/Folio.app
          python3 scripts/collect-npm-license-materials.py
          python3 scripts/verify-javascript-sources.py
          python3 scripts/collect-pdfjs-license-materials.py
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-silicon-qualification-${{ github.sha }}
          archive: true
          path: |
            release/native-tests.json
            release/verification.json
            release/SHA256SUMS
            release/disk-image-verification.log
            release/mac-arm64/runtime-signing.json
            artifacts/license-materials/mac-app/
            artifacts/license-materials/javascript/
            artifacts/license-materials/npm/inventory.json
            artifacts/license-materials/pdfjs/inventory.json
            test-results/*-final.log
            test-results/published-pack-base.json
            test-results/chat-*/failure.png
            test-results/chat-*/lifecycle.json
            test-results/chat-*/native-output.log
            test-results/runtime-*/compiler-storage*.png
            test-results/runtime-*/result.json
            test-results/runtime-*/startup-chat.png
            test-results/runtime-*/startup-editing.png
            test-results/runtime-*/failure.png
            test-results/build-requests-*/result.json
            test-results/build-requests-*/newest.pdf
            test-results/build-requests-*/failure.png
            test-results/build-crash-*/result.json
            test-results/build-crash-*/native-output.log
            test-results/build-crash-*/during-compile.png
            test-results/build-crash-*/recovered-chat.png
            test-results/build-crash-*/recovered.pdf
            test-results/build-crash-*/failure.png
            test-results/recovery-writes-*/result.json
            test-results/recovery-writes-*/recovery-retry.png
            test-results/recovery-writes-*/recovery-retried.png
            test-results/recovery-writes-*/failure.png
            test-results/preferences-*/result.json
            test-results/preferences-*/native-output.log
            test-results/preferences-*/save-error.png
            test-results/preferences-*/startup-error.png
            test-results/preferences-*/recovered-settings.png
            test-results/preferences-*/failure.png
            test-results/workspace-*/layout-measurements.json
            test-results/workspace-*/keyboard-*.png
            test-results/workspace-*/failure.png
            test-results/workspace-*/result.json
            test-results/history-storage-*/result.json
            test-results/history-storage-*/history-removal-*.png
            test-results/history-storage-*/failure.png
            test-results/diagnostics-*/result.json
            test-results/diagnostics-*/failure.png
            test-results/fonts-*/result.json
            test-results/fonts-*/failure.png
            test-results/support-*/result.json
            test-results/support-*/failure.png
            test-results/app-updates-*/result.json
            test-results/app-updates-*/updates-*.png
            test-results/app-updates-*/failure.png
            test-results/update-download-*/result.json
            test-results/update-download-*/inputs.json
            test-results/update-download-*/native-output.log
            test-results/update-download-*/failure.json
            test-results/update-download-*/process-failure.json
            test-results/update-download-*/progress.json
            test-results/save-recovery-*/result.json
            test-results/save-recovery-*/failure.png
            test-results/pack-catalog-*/result.json
            test-results/pack-catalog-*/failure.png
            test-results/template-regression-*/
          if-no-files-found: warn
          retention-days: 14
      # Do not upload the runtime/DMG yet: redistribution materials, signing,
      # notarization and signed-artifact acceptance remain release requirements.
